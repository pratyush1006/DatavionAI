events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    client_max_body_size 100M;

    # Preserve the original protocol supplied by Cloudflare.
    # When the request arrives directly without the header,
    # fall back to Nginx's local scheme.
    map $http_x_forwarded_proto $datavion_forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:8000;
    }

    # --------------------------------------------------------------------------
    # Public website
    # --------------------------------------------------------------------------

    server {
        listen 80;
        server_name datavionanalytics.in www.datavionanalytics.in;

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $datavion_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 120s;
            proxy_connect_timeout 30s;
        }
    }

    # --------------------------------------------------------------------------
    # API
    # --------------------------------------------------------------------------

    server {
        listen 80;
        server_name api.datavionanalytics.in;

        location /static/ {
            alias /staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /media/ {
            alias /media/;
        }

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $datavion_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;

            proxy_read_timeout 120s;
            proxy_connect_timeout 30s;
        }
    }
}
