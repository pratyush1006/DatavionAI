name: Backend CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:

###############################################################################
# Code Quality
###############################################################################

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: platform

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            platform/requirements.txt
            platform/pyproject.toml

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: MyPy
        run: mypy .

      - name: Bandit
        run: bandit -c pyproject.toml -r apps

###############################################################################
# Django Tests
###############################################################################

  test:
    name: Django Tests

    runs-on: ubuntu-latest

    needs:
      - lint

    timeout-minutes: 20

    defaults:
      run:
        working-directory: platform

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: datavion
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SECRET_KEY: django-test-secret-key
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1

      DATABASE_NAME: datavion
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            platform/requirements.txt
            platform/pyproject.toml

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for PostgreSQL
        run: |
          python - <<'EOF'
          import socket
          import time

          for _ in range(30):
              try:
                  socket.create_connection(("localhost", 5432), timeout=2)
                  print("PostgreSQL is ready.")
                  raise SystemExit(0)
              except OSError:
                  time.sleep(2)

          raise RuntimeError("PostgreSQL did not become ready.")
          EOF

      - name: Apply Migrations
        run: python manage.py migrate

      - name: Check Missing Migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Django System Check
        run: python manage.py check

      - name: Run Tests
        run: pytest

      - name: Coverage
        run: |
          coverage run -m pytest
          coverage report
          coverage xml

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: platform/coverage.xml
