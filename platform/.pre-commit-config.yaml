[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

################################################################################
# PROJECT
################################################################################

[project]
name = "datavion-ai-platform"
version = "1.1.0"
description = "Enterprise AI-Powered Healthcare Revenue Cycle Management Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

authors = [
    { name = "Datavion AI Engineering Team" }
]

keywords = [
    "django",
    "djangorestframework",
    "healthcare",
    "ehr",
    "rcm",
    "analytics",
    "ai",
    "rag",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

################################################################################
# BLACK
################################################################################

[tool.black]
line-length = 88
target-version = ["py312"]
skip-string-normalization = true

################################################################################
# RUFF
################################################################################

[tool.ruff]
line-length = 88
target-version = "py312"
cache-dir = ".ruff_cache"
unsafe-fixes = false

exclude = [
    ".git",
    ".github",
    ".venv",
    "venv",
    "env",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    ".tox",
    ".nox",
    "build",
    "dist",
    "coverage",
    "htmlcov",
    "media",
    "staticfiles",
    "generated",
    "node_modules",
    "**/migrations",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "DJ",
    "C4",
    "ISC",
    "RET",
    "PIE",
]

ignore = [
    "E501",
    "B008",
]

fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

################################################################################
# MYPY
################################################################################

[tool.mypy]
python_version = "3.12"

plugins = [
    "mypy_django_plugin.main",
]

namespace_packages = true
explicit_package_bases = true

cache_dir = ".mypy_cache"

incremental = true
pretty = true
show_error_codes = true

warn_unused_configs = true
warn_unused_ignores = true
warn_return_any = true
warn_redundant_casts = true
warn_unreachable = true

check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
strict_optional = true

# MyPy expects a Python regular expression, not glob patterns.
exclude = '''(?x)(
    ^\.venv/
  | ^venv/
  | ^\.tox/
  | ^build/
  | ^dist/
  | ^\.pytest_cache/
  | (^|.*/)migrations/
)'''

[[tool.mypy.overrides]]
module = [
    "rest_framework.*",
    "drf_spectacular.*",
    "django_filters.*",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

################################################################################
# PYTEST
################################################################################

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"

python_files = [
    "test_*.py",
    "*_tests.py",
]

testpaths = [
    "apps",
]

addopts = [
    "--reuse-db",
    "--strict-config",
    "--strict-markers",
    "--tb=short",
    "--cov=apps",
    "--cov-report=term-missing",
    "--cov-report=xml",
]

markers = [
    "unit",
    "integration",
    "api",
    "slow",
]

asyncio_mode = "auto"

xfail_strict = true

log_cli = true
log_cli_level = "INFO"

################################################################################
# COVERAGE
################################################################################

[tool.coverage.run]
branch = true

source = [
    "apps",
]

omit = [
    "*/migrations/*",
    "*/tests/*",
    "manage.py",
]

[tool.coverage.paths]
source = [
    "apps",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2
fail_under = 95

[tool.coverage.xml]
output = "coverage.xml"

################################################################################
# BANDIT
################################################################################

[tool.bandit]
exclude_dirs = [
    "tests",
    ".venv",
    "venv",
]

skips = [
    "B101",
]

severity = "medium"
confidence = "medium"

################################################################################
# SETUPTOOLS
################################################################################

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = [
    "apps*",
    "config*",
]
exclude = [
    "tests*",
    "docs*",
    "__pycache__*",
]

################################################################################
# UV
################################################################################

[tool.uv]
package = false
