openapi: 3.0.3
info:
  title: Datavion AI API
  version: 1.0.0
  description: AI Powered Revenue Cycle Management Platform
paths:
  /api/allergies/:
    get:
      operationId: api_allergies_list
      description: List existing allergies or create a new allergy.
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - environmental
          - food
          - insect
          - latex
          - medication
          - other
        description: |-
          Allergy category.

          * `medication` - Medication
          * `food` - Food
          * `environmental` - Environmental
          * `latex` - Latex
          * `insect` - Insect
          * `other` - Other
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: severity
        schema:
          type: string
          enum:
          - life_threatening
          - mild
          - moderate
          - severe
        description: |-
          Allergy severity.

          * `mild` - Mild
          * `moderate` - Moderate
          * `severe` - Severe
          * `life_threatening` - Life Threatening
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - entered_in_error
          - resolved
        description: |-
          Current allergy status.

          * `active` - Active
          * `resolved` - Resolved
          * `entered_in_error` - Entered In Error
      tags:
      - Allergies
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAllergyListList'
          description: ''
    post:
      operationId: api_allergies_create
      description: List existing allergies or create a new allergy.
      tags:
      - Allergies
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllergyCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AllergyCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AllergyCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllergyCreate'
          description: ''
