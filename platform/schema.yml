components:
  schemas:
    AllergyCreate:
      type: object
      description: Serializer for creating allergies.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        organization:
          type: string
          format: uuid
          description: Organization that owns this allergy.
        patient:
          type: string
          format: uuid
          description: Patient with this allergy.
        provider:
          type: string
          format: uuid
          description: Provider who recorded this allergy.
        encounter:
          type: string
          format: uuid
          description: Encounter associated with this allergy.
        allergen:
          type: string
          description: Allergen name.
          maxLength: 255
        category:
          allOf:
          - $ref: '#/components/schemas/Category947Enum'
          description: |-
            Allergy category.

            * `medication` - Medication
            * `food` - Food
            * `environmental` - Environmental
            * `latex` - Latex
            * `insect` - Insect
            * `other` - Other
        severity:
          allOf:
          - $ref: '#/components/schemas/SeverityEnum'
          description: |-
            Allergy severity.

            * `mild` - Mild
            * `moderate` - Moderate
            * `severe` - Severe
            * `life_threatening` - Life Threatening
        status:
          allOf:
          - $ref: '#/components/schemas/Status277Enum'
          description: |-
            Current allergy status.

            * `active` - Active
            * `resolved` - Resolved
            * `entered_in_error` - Entered In Error
        reaction:
          type: string
          description: Observed allergic reaction.
        onset_date:
          type: string
          format: date
          nullable: true
          description: Date when the allergy was first identified.
        resolved_date:
          type: string
          format: date
          nullable: true
          description: Date when the allergy resolved.
        notes:
          type: string
          description: Additional clinical notes.
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
